# --- video-scene-extractor v2 (2026-10-05) --------------------------------------
# Replace the dsh-video-scene-extractor bundle's host row (v1, github erosDiffusion/dsh
# @ 7dc012c1) with the local v2: patched runbook + scripts live in
# ~/Apps/deepseek-workspace/dsh-video-scene-extractor-v2/ (fixes: --quiet flag, data/
# layout, consolidate crash guard + onsets.txt, extract_frames bare-number bug, montage
# dir, hashcheck verify mode, check_ffmpeg false alarm — see CHANGELOG.md there).
# The bundle's index.js hardcodes SKILL_DIR from its own package location, so a
# config override cannot redirect it: disable the row, insert a local twin that
# registers the same shellEnv var (DSH_VIDEO_SKILL_DIR) + /video-extractor command
# pointing at the v2 runbook.
- id: video-scene-extractor
  disabled: true
- insert:
    - id: video-scene-extractor-v2
      name: '/home/oem/Apps/deepseek-workspace/dsh-video-scene-extractor-v2/plugin/index.js'
# The bundle's preset row (preset-video-scene-extractor) resolves its skill-filesystem
# customSkillDirs from the installed package. The profile patch layer REPLACES the whole
# `config` of a per-id override (verified via --dump-config: a partial override wiped the
# preset identity + plugins), so this is the bundle's full preset config copied verbatim
# from presets/video-scene-extractor.patch.yml with ONE change: customSkillDirs now points
# at the v2 skills dir. If the bundle updates its preset, regenerate this block (swap the
# customSkillDirs !!js line in the bundle YAML for the v2 path — see the generation recipe
# in ~/Apps/deepseek-workspace/dsh-video-scene-extractor-v2/CHANGELOG.md).
- id: preset-video-scene-extractor
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: video-scene-extractor
    name: Video Scene Extractor
    description: Verified scene/cut analysis of captured or finished video — start frame of every cut, dialogue cued per scene, per-shot description, verified against the source. Deterministic ffmpeg/whisper/PIL pipeline.
    order: 10
    plugins:
      # Persona: the video-scene-extractor skill + its hard-won failure catalog
      # own the operating detail; the persona fixes the job and the boundaries.
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: |
            You are a video-scene-extractor agent powered by the {{model}} model, running on the DeepSeek Harness.

            Your single job: analyze a captured/finished video into a verified scene list — the START FRAME of every cut (scene boundary), dialogue cued per scene from a word-timestamped transcript, and a short description of each shot — then verify every onset against the source footage before it ships. Load the `video-scene-extractor` skill FIRST; it encodes the deterministic pipeline (packet-pts mapping, MAD isolated-spike detection, before/after sheet verification, extraction/renaming contracts) and the hard-won failure catalog.

            Boundaries: ffmpeg/whisper/PIL are your instruments — deterministic scripts, never guesswork. You do not re-encode the source, do not transcribe (you consume the transcript), do not author creative content. Verification-first: an onset ships only with a visual before/after verdict (or an explicit signature-trust flag when vision is unavailable).
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
              toolFilter:
                deny:
                  - schedule_create
                  - schedule_delete
                  - schedule_list
                  - schedule_update
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
              toolFilter:
                deny:
                  - schedule_create
                  - schedule_delete
                  - schedule_list
                  - schedule_update
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - /home/oem/Apps/deepseek-workspace/dsh-video-scene-extractor-v2/skills
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"
